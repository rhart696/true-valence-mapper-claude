name: TVM dependency and evidence review
on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tvm-periodic-review
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check active work-package source currency
        run: python3 scripts/check-process.py
      - name: Audit full lockfile (development findings remain visible)
        working-directory: v1
        run: npm audit --package-lock-only --audit-level=high --json > dependency-audit.json
      - name: Preserve actual audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tvm-dependency-review
          path: v1/dependency-audit.json
          if-no-files-found: warn
          retention-days: 30
      # Audit success does not establish application security or client readiness.
