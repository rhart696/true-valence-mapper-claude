name: TVM release readiness
on:
  workflow_dispatch:
    inputs:
      release_pr:
        description: 'Merged release-decision PR number'
        required: true
        type: number
      build_sha:
        description: 'Full reviewed application commit SHA'
        required: true
        type: string
      config_digest:
        description: 'SHA256 of sanitized release configuration inventory'
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
jobs:
  evidence:
    name: TVM release evidence
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Execute only reviewed main policy. Never check out the user-supplied SHA.
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Verify current evidence and human decisions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ inputs.release_pr }}
          BUILD_SHA: ${{ inputs.build_sha }}
          CONFIG_DIGEST: ${{ inputs.config_digest }}
        run: |
          python3 scripts/check-process.py --authorize-release --release-pr "$RELEASE_PR" --build "$BUILD_SHA" --config-digest "$CONFIG_DIGEST"
      - name: Verify live merge rules
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-enforcement-activation.py
      # This workflow proves readiness only; it has no deployment credentials.
